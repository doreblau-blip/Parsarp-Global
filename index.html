<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parsarp Global — Çok Yakında</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:linear-gradient(135deg,#0d2333 0%,#193A4E 40%,#2a5a72 75%,#1a4a60 100%);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:2rem;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);
    width:70vw;height:70vw;
    background:radial-gradient(circle,rgba(80,123,143,0.18) 0%,transparent 65%);
    pointer-events:none;
  }
  body::after{
    content:'';position:fixed;bottom:-20%;right:-10%;
    width:50vw;height:50vw;
    background:radial-gradient(circle,rgba(195,212,215,0.07) 0%,transparent 65%);
    pointer-events:none;
  }
  .corner{position:fixed;width:22px;height:22px;border-color:rgba(195,212,215,0.18);border-style:solid}
  .corner.tl{top:1.75rem;left:1.75rem;border-width:1px 0 0 1px}
  .corner.tr{top:1.75rem;right:1.75rem;border-width:1px 1px 0 0}
  .corner.bl{bottom:1.75rem;left:1.75rem;border-width:0 0 1px 1px}
  .corner.br{bottom:1.75rem;right:1.75rem;border-width:0 1px 1px 0}
  .center{text-align:center;position:relative;z-index:1}
  .parsarp{
    display:block;
    font-size:clamp(4rem,14vw,9.5rem);
    font-weight:800;
    letter-spacing:-0.04em;
    line-height:1;
    color:#ffffff;
  }
  .global{
    display:block;
    font-size:clamp(4rem,14vw,9.5rem);
    font-weight:200;
    letter-spacing:0.14em;
    line-height:1;
    background:linear-gradient(90deg,#C3D4D7 0%,#ffffff 50%,#8ab0bc 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .hairline{
    width:48px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(195,212,215,0.5),transparent);
    margin:2rem auto;
  }
  .soon{
    font-size:clamp(0.65rem,1.8vw,0.8rem);
    font-weight:600;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:rgba(195,212,215,0.6);
    margin-bottom:1.5rem;
  }
  .mail-link{
    display:inline-block;
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.15em;
    color:rgba(195,212,215,0.55);
    text-decoration:none;
    border-bottom:1px solid rgba(195,212,215,0.2);
    padding-bottom:3px;
    transition:color 0.25s,border-color 0.25s;
  }
  .mail-link:hover{color:#C3D4D7;border-color:rgba(195,212,215,0.5)}
</style>
</head>
<body>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="center">
    <span class="parsarp">PARSARP</span>
    <span class="global">GLOBAL</span>
    <div class="hairline"></div>
    <p class="soon">Çok Yakında</p>
    <a class="mail-link" href="mailto:info@parsarpglobal.com">info@parsarpglobal.com</a>
  </div>
</body>
</html>
